name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the token can read the repo and nothing else. Jobs that need more ask for it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs, but let every main run finish: path filters diff against the
  # previous commit, so a cancelled main run can leave that commit's changes untested.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to full commit SHAs (a tag can be moved to malicious code; a SHA can't).
# Dependabot keeps the SHA and the version comment up to date.
jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # paths-filter lists PR files via the API
    outputs:
      dotnet: ${{ steps.filter.outputs.dotnet }}
      web: ${{ steps.filter.outputs.web }}
      contract: ${{ steps.filter.outputs.contract }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            shared: &shared
              - .github/workflows/**
              - contracts/**
              - Taskfile.yml
            dotnet: &dotnet
              - *shared
              - "services/**"
              - "libs/**"
              - "tests/**"
              - "*.props"
              - "*.slnx"
              - global.json
              - dotnet-tools.json
              - .editorconfig
            web: &web
              - *shared
              - "apps/**"
              - "packages/**"
              - "package.json"
              - "pnpm-*.yaml"
              - turbo.json
              - .nvmrc
              - ".prettier*"
            contract:
              - *dotnet
              - *web

  dotnet:
    needs: changes
    if: needs.changes.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore Acme.slnx --locked-mode
      - run: dotnet format Acme.slnx --verify-no-changes --no-restore
      - run: dotnet build Acme.slnx --no-restore -c Release
      - run: dotnet test Acme.slnx --no-build -c Release

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm turbo run lint typecheck test build

  # The monorepo's reason to exist: C# DTOs, contracts/openapi.json and the TS client must agree.
  # Regenerates everything with the same `task codegen` you run locally and fails on any diff.
  contract:
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
      - run: pnpm install --frozen-lockfile
      - run: dotnet restore Acme.slnx --locked-mode
      - run: task codegen
      - name: Fail if generated contract files drifted
        run: |
          if [ -n "$(git status --porcelain -- contracts packages/api-client/src)" ]; then
            git --no-pager diff -- contracts packages/api-client/src
            git status --short -- contracts packages/api-client/src
            echo "::error::Contract drift: run 'task codegen' and commit contracts/ and packages/api-client/src/."
            exit 1
          fi
