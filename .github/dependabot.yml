# Templates rot fast. Keep this repo current so every new project starts current.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule: { interval: weekly }
    groups:
      dotnet:
        patterns: ["*"]
  - package-ecosystem: npm # pnpm lockfile + catalog are detected
    directory: /
    schedule: { interval: weekly }
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: docker-compose
    directory: /infra/docker
    schedule: { interval: monthly }
